spring:
  application:
    name: document-service
  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]
  datasource:
    url: ${DOCUMENT_DB_URL:jdbc:postgresql://localhost:5432/document}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration,classpath:db/socle
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL_PUBLIQUE:http://localhost:8180}/realms/ecivil
          jwk-set-uri: ${KEYCLOAK_URL_INTERNE:http://localhost:8180}/realms/ecivil/protocol/openid-connect/certs
      client:
        # Jeton de service (client credentials) pour relire les actes dans le registre
        registration:
          service:
            provider: keycloak
            client-id: document-service
            client-secret: ${DOCUMENT_SERVICE_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_URL_INTERNE:http://localhost:8180}/realms/ecivil/protocol/openid-connect/token

ecivil:
  url-publique: ${ECIVIL_URL_PUBLIQUE:http://localhost:8080}
  services:
    registre: ${REGISTRE_SERVICE_URL:http://localhost:8083}

server:
  port: ${PORT:8084}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
