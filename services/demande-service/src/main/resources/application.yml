spring:
  application:
    name: demande-service
  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]
  datasource:
    url: ${DEMANDE_DB_URL:jdbc:postgresql://localhost:5432/demande}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration,classpath:db/socle
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener.simple:
      default-requeue-rejected: false   # après les tentatives, le message part en file d'erreurs
      retry:
        enabled: true
        max-attempts: 5
        initial-interval: 2s
        multiplier: 2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL_PUBLIQUE:http://localhost:8180}/realms/ecivil
          jwk-set-uri: ${KEYCLOAK_URL_INTERNE:http://localhost:8180}/realms/ecivil/protocol/openid-connect/certs
      client:
        # Jeton de service (client credentials) pour appeler le registre et le service des documents
        registration:
          service:
            provider: keycloak
            client-id: demande-service
            client-secret: ${DEMANDE_SERVICE_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_URL_INTERNE:http://localhost:8180}/realms/ecivil/protocol/openid-connect/token

ecivil:
  services:
    registre: ${REGISTRE_SERVICE_URL:http://localhost:8083}
    document: ${DOCUMENT_SERVICE_URL:http://localhost:8084}

server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
