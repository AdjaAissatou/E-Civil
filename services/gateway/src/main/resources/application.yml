spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        # API REST des microservices (chacun vérifie lui-même le jeton Keycloak)
        - id: demandes
          uri: ${DEMANDE_SERVICE_URL:http://localhost:8081}
          predicates: [ "Path=/api/demandes/**,/api/catalogue/**" ]
        - id: paiements
          uri: ${PAIEMENT_SERVICE_URL:http://localhost:8082}
          predicates: [ "Path=/api/paiements/**" ]
        - id: registre
          uri: ${REGISTRE_SERVICE_URL:http://localhost:8083}
          predicates: [ "Path=/api/registre/**" ]
        - id: documents
          uri: ${DOCUMENT_SERVICE_URL:http://localhost:8084}
          predicates: [ "Path=/api/documents/**,/api/verification/**" ]
        # Tout le reste : le portail web (pages, connexion Keycloak, fichiers statiques)
        - id: portail
          uri: ${PORTAIL_URL:http://localhost:8090}
          predicates: [ "Path=/**" ]
          filters:
            - PreserveHostHeader

server:
  port: ${PORT:8080}

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
