<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: page(${status == 403} ? 'Accès refusé' : (${status == 404} ? 'Page introuvable' : 'Erreur'), ~{::main})}">
<body>
<main class="page-erreur container">
    <div class="carte-erreur">
        <span class="icone-erreur" th:classappend="${status == 403} ? 'or'" aria-hidden="true">
            <i class="bi" th:classappend="${status == 403} ? 'bi-shield-lock' : (${status == 404} ? 'bi-signpost-split' : 'bi-cloud-slash')"></i>
        </span>
        <span class="code-erreur" th:text="${status}">404</span>
        <h1 th:text="${status == 404} ? 'Page introuvable' : (${status == 403} ? 'Accès refusé' : 'Une erreur est survenue')">Erreur</h1>

        <p th:if="${status == 403}">Votre profil ne comporte pas la permission nécessaire pour ouvrir cette page.
            Si vous pensez devoir y accéder, adressez-vous à l'administrateur de la plateforme.</p>
        <p th:if="${status == 404}">L'adresse demandée n'existe pas ou a été déplacée.</p>
        <p th:if="${status != 403 and status != 404}"
           th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : 'Le problème a été enregistré. Réessayez dans quelques instants.'"></p>

        <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
            <a class="btn btn-primary" sec:authorize="hasRole('DEMANDES_DEPOSER')"
               th:href="@{/demandes}"><i class="bi bi-folder2-open me-2"></i>Mes demandes</a>
            <a class="btn btn-contour" th:href="@{/}"><i class="bi bi-house me-2"></i>Retour à l'accueil</a>
        </div>
    </div>
</main>
</body>
</html>
