<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(#{admin.onglets.natures}, ~{::main})}">
<body>
<main class="container py-4">
    <span class="surtitre"><th:block th:text="#{admin.onglets.administration}">Administration</th:block></span>
    <h1 class="h3"><th:block th:text="#{admin.natures.natures_de_documents}">Natures de documents</th:block></h1>
    <nav th:replace="~{admin/_onglets :: onglets('natures')}"></nav>
    <p class="text-muted"><th:block th:text="#{admin.natures.une_nature_regroupe_des_documents_naissance}">Une nature regroupe des documents (Naissance, Célibat, Copie…) ; elle sert de filtre dans le catalogue.
        Une nature inactive n'apparaît plus dans le catalogue, ses documents restent.</th:block></p>
    <div class="card mb-4"><div class="table-responsive">
        <table class="table align-middle mb-0">
            <thead><tr><th><th:block th:text="#{admin.motifs.ordre}">Ordre</th:block></th><th><th:block th:text="#{admin.document.code}">Code</th:block></th><th><th:block th:text="#{admin.document.libelle}">Libellé</th:block></th><th><th:block th:text="#{admin.natures.description}">Description</th:block></th><th><th:block th:text="#{admin.natures.documents}">Documents</th:block></th><th><th:block th:text="#{admin.missions.active}">Active</th:block></th><th></th></tr></thead>
            <tbody>
            <tr th:each="n : ${natures}">
                <td colspan="7">
                    <form class="row g-2 align-items-center" method="post" th:action="@{/admin/natures}">
                        <input type="hidden" name="id" th:value="${n.id}">
                        <div class="col-md-1"><input class="form-control form-control-sm" type="number" name="ordre" min="0" max="999" th:value="${n.ordre}" aria-label="Ordre" th:aria-label="#{admin.motifs.ordre}"></div>
                        <div class="col-md-2"><code th:text="${n.code}"></code></div>
                        <div class="col-md-3"><input class="form-control form-control-sm" name="libelle" required maxlength="100" th:value="${n.libelle}" aria-label="Libellé" th:aria-label="#{admin.document.libelle}"></div>
                        <div class="col-md-3"><input class="form-control form-control-sm" name="description" maxlength="500" th:value="${n.description}" aria-label="Description" th:aria-label="#{admin.natures.description}"></div>
                        <div class="col-md-1 small" th:text="${nombre[n.id] ?: 0}"></div>
                        <div class="col-md-1"><input class="form-check-input" type="checkbox" name="active" value="true" th:checked="${n.active}" aria-label="Active" th:aria-label="#{admin.missions.active}"></div>
                        <div class="col-md-1"><button class="btn btn-outline-primary btn-sm" type="submit">OK</button></div>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div></div>
    <div class="card"><div class="card-body">
        <h2 class="h6 text-brun"><th:block th:text="#{admin.natures.nouvelle_nature}">Nouvelle nature</th:block></h2>
        <form class="row g-2" method="post" th:action="@{/admin/natures}">
            <div class="col-md-2"><input class="form-control" name="code" required maxlength="40" placeholder="Code (ex. ADOPTION)" th:placeholder="#{admin.natures.code_ex_adoption}"></div>
            <div class="col-md-3"><input class="form-control" name="libelle" required maxlength="100" placeholder="Libellé" th:placeholder="#{admin.document.libelle}"></div>
            <div class="col-md-4"><input class="form-control" name="description" maxlength="500" placeholder="Description" th:placeholder="#{admin.natures.description}"></div>
            <div class="col-md-1"><input class="form-control" name="ordre" type="number" min="0" max="999" value="200" aria-label="Ordre" th:aria-label="#{admin.motifs.ordre}"></div>
            <div class="col-md-2"><button class="btn btn-primary w-100" type="submit"><th:block th:text="#{admin.natures.creer}">Créer</th:block></button></div>
        </form>
    </div></div>
</main>
</body>
</html>
