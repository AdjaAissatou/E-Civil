<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(#{admin.onglets.roles}, ~{::main})}">
<body>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
        <div>
            <span class="surtitre"><th:block th:text="#{admin.onglets.administration}">Administration</th:block></span>
            <h1 class="h3 mb-0"><th:block th:text="#{admin.onglets.roles}">Rôles</th:block></h1>
        </div>
        <a class="btn btn-primary btn-sm" th:href="@{/admin/roles/nouveau}"><i class="bi bi-plus-lg me-1"></i><th:block th:text="#{admin.role.nouveau_role}">Nouveau rôle</th:block></a>
    </div>
    <nav th:replace="~{admin/_onglets :: onglets('roles')}"></nav>

    <p class="text-muted"><th:block th:text="#{admin.roles.un_role_est_une_fonction_delegue}">Un rôle est une fonction (délégué, officier…) qui accorde un ensemble de permissions. Les rôles
        s'attribuent par les profils. Les rôles de base peuvent être modifiés mais pas supprimés.</th:block></p>

    <div class="card"><div class="table-responsive">
        <table class="table align-middle mb-0">
            <thead><tr><th><th:block th:text="#{admin.roles.role}">Rôle</th:block></th><th><th:block th:text="#{admin.role.permissions_accordees}">Permissions accordées</th:block></th><th><th:block th:text="#{admin.roles.utilise_par_les_profils}">Utilisé par les profils</th:block></th><th></th></tr></thead>
            <tbody>
            <tr th:each="r : ${roles}">
                <td>
                    <div class="fw-semibold" th:text="${r.libelle}"></div>
                    <code class="small" th:text="${r.code}"></code>
                    <span th:if="${r.deBase}" class="etiquette ms-1"><th:block th:text="#{admin.roles.de_base}">de base</th:block></span>
                </td>
                <td style="max-width: 460px">
                    <span th:each="c : ${r.permissions}" class="etiquette me-1 d-inline-block mb-1"
                          th:text="${permissions[c] != null} ? ${permissions[c].libelle} : ${c}"></span>
                </td>
                <td>
                    <a th:each="p : ${r.profils}" class="d-block small" th:href="@{/admin/profils/{id}(id=${p.id})}" th:text="${p.nom}"></a>
                    <span th:if="${r.profils.isEmpty()}" class="small text-muted">aucun</span>
                </td>
                <td class="text-end"><a class="btn btn-outline-primary btn-sm" th:href="@{/admin/roles/{c}(c=${r.code})}"><th:block th:text="#{admin.missions.modifier}">Modifier</th:block></a></td>
            </tr>
            </tbody>
        </table>
    </div></div>
</main>
</body>
</html>
