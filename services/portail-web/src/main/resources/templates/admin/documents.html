<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(#{admin.onglets.documents_et_tarifs}, ~{::main})}">
<body>
<main class="container-fluid px-lg-5 py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
        <div>
            <span class="surtitre"><th:block th:text="#{admin.onglets.administration}">Administration</th:block></span>
            <h1 class="h3 mb-0"><th:block th:text="#{admin.onglets.documents_et_tarifs}">Documents et tarifs</th:block></h1>
        </div>
        <a class="btn btn-primary btn-sm" th:href="@{/admin/documents/nouveau}"><i class="bi bi-plus-lg me-1"></i><th:block th:text="#{admin.document.nouveau_document}">Nouveau document</th:block></a>
    </div>
    <nav th:replace="~{admin/_onglets :: onglets('documents')}"></nav>
    <p class="text-muted"><th:block th:text="#{admin.documents.chaque_document_variete_appartient_a_une}">Chaque document (variété) appartient à une nature. Le tarif est figé au dépôt de chaque demande :
        une modification ne s'applique qu'aux nouvelles demandes.</th:block></p>
    <div class="card"><div class="table-responsive">
        <table class="table align-middle mb-0">
            <thead><tr><th><th:block th:text="#{admin.documents.document}">Document</th:block></th><th><th:block th:text="#{admin.document.nature}">Nature</th:block></th><th><th:block th:text="#{admin.documents.modele}">Modèle</th:block></th><th><th:block th:text="#{admin.documents.validite}">Validité</th:block></th>
                <th style="width:130px"><th:block th:text="#{admin.document.tarif_fcfa}">Tarif (FCFA)</th:block></th><th style="width:100px"><th:block th:text="#{admin.documents.delai_j}">Délai (j)</th:block></th><th><th:block th:text="#{admin.documents.propose}">Proposé</th:block></th><th></th><th></th></tr></thead>
            <tbody>
            <tr th:each="t : ${documents}">
                <td><div class="fw-semibold" th:text="${t.libelle}"></div><code class="small" th:text="${t.code}"></code>
                    <span th:if="${t.estOriginal}" class="etiquette ms-1">original</span>
                    <span th:if="${t.copieDeId}" class="etiquette ms-1">copie</span></td>
                <td class="small" th:text="${t.libelleNature}"></td>
                <td class="small" th:text="${t.libelleModele}"></td>
                <td class="small" th:text="${t.libelleValidite()}"></td>
                <td colspan="4">
                    <form class="row g-2 align-items-center" th:action="@{/admin/documents/{id}(id=${t.id})}" method="post">
                        <div class="col-5"><input class="form-control form-control-sm" type="number" min="200" step="50" name="tarif" th:value="${t.tarif}" aria-label="Tarif" th:aria-label="#{admin.documents.tarif}"></div>
                        <div class="col-3"><input class="form-control form-control-sm" type="number" min="1" max="60" name="delaiJours" th:value="${t.delaiJours}" aria-label="Délai" th:aria-label="#{admin.documents.delai}"></div>
                        <div class="col-1"><input class="form-check-input" type="checkbox" name="actif" value="true" th:checked="${t.actif}" aria-label="Proposé" th:aria-label="#{admin.documents.propose}"></div>
                        <div class="col-3"><button class="btn btn-sm btn-outline-primary" type="submit"><th:block th:text="#{admin.document.enregistrer}">Enregistrer</th:block></button></div>
                    </form>
                </td>
                <td class="text-end"><a class="btn btn-link btn-sm" th:href="@{/admin/documents/{id}/modifier(id=${t.id})}"><th:block th:text="#{admin.documents.tout_modifier}">Tout modifier</th:block></a></td>
            </tr>
            </tbody>
        </table>
    </div></div>
</main>
</body>
</html>
