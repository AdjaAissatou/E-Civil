<!-- Cases à cocher des permissions, regroupées par famille -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="cases(parFamille, cochee)">
    <div th:each="f : ${parFamille}" class="mb-3">
        <div class="small fw-semibold text-uppercase text-muted mb-1" th:text="${f.key}"></div>
        <div class="form-check py-2 border-bottom" th:each="p : ${f.value}">
            <input class="form-check-input" type="checkbox" name="permission" th:value="${p.code}" th:id="'perm-' + ${p.code}"
                   th:checked="${cochee != null and cochee.contains(p.code)}">
            <label class="form-check-label w-100" th:for="'perm-' + ${p.code}">
                <span class="fw-semibold" th:text="${p.libelle}"></span> <code class="small" th:text="${p.code}"></code>
                <span class="d-block small text-muted" th:text="${p.description}"></span>
                <span class="d-block small text-success" th:if="${p.avantage}"><i class="bi bi-plus-circle me-1"></i><span th:text="${p.avantage}"></span></span>
                <span class="d-block small text-danger" th:if="${p.interdiction}"><i class="bi bi-dash-circle me-1"></i><span th:text="${p.interdiction}"></span></span>
            </label>
        </div>
    </div>
</div>
