<!-- Suivi visuel des étapes d'une demande -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="suivi(d)" class="suivi" role="list" aria-label="Avancement de la demande" th:aria-label="#{fragments.suivi.avancement_de_la_demande}"
     th:with="c=${d.etapeCourante}">
    <div th:each="e, i : ${ {'deposee','validee','payee','acte_retrouve','delivree'} }" role="listitem"
         th:with="n=${i.count}"
         th:class="'suivi-etape ' + (${n < c} ? 'fait' : (${n == c} ? (${d.arretee} ? 'arret' : 'courant') : ''))">
        <div class="suivi-rond">
            <i th:if="${n < c}" class="bi bi-check-lg"></i>
            <i th:if="${n == c and d.arretee}" class="bi bi-x-lg"></i>
            <span th:if="${n >= c and !(n == c and d.arretee)}" th:text="${n}"></span>
        </div>
        <div class="suivi-libelle" th:text="${n == c and d.arretee} ? ${#messages.msgOrNull('statut.' + d.statut)} : #{'suivi.' + ${e}}"></div>
    </div>
</div>
