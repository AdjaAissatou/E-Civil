<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(#{citoyen.demande.mes_demandes}, ~{::main})}">
<body>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0"><th:block th:text="#{citoyen.demande.mes_demandes}">Mes demandes</th:block></h1>
        <a class="btn btn-primary" th:href="@{/documents}"><i class="bi bi-plus-lg me-1"></i><th:block th:text="#{citoyen.demandes.nouvelle_demande}">Nouvelle demande</th:block></a>
    </div>
    <div class="row g-2 mb-3" th:unless="${#lists.isEmpty(demandes)}">
        <div class="col-6 col-md" th:each="e : ${etapes}">
            <div class="card h-100"><div class="card-body py-2">
                <div class="small text-muted" th:text="${e.key}"></div>
                <div class="fs-4 fw-semibold" th:text="${e.value}">0</div>
            </div></div>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(demandes)}" class="card"><div class="card-body text-center py-5 text-muted">
        <th:block th:text="#{citoyen.demandes.vous_n_avez_encore_fait_aucune}">Vous n'avez encore fait aucune demande.</th:block> <a th:href="@{/documents}"><th:block th:text="#{citoyen.demandes.choisissez_un_document}">Choisissez un document</th:block></a> <th:block th:text="#{citoyen.demandes.pour_commencer}">pour commencer.</th:block>
    </div></div>
    <div class="card" th:unless="${#lists.isEmpty(demandes)}">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th><th:block th:text="#{agent.demandes.reference}">Référence</th:block></th><th><th:block th:text="#{admin.documents.document}">Document</th:block></th><th><th:block th:text="#{agent.demandes.personne_concernee}">Personne concernée</th:block></th><th><th:block th:text="#{admin.onglets.date}">Date</th:block></th><th><th:block th:text="#{agent.demande.statut}">Statut</th:block></th><th></th></tr></thead>
                <tbody>
                <tr th:each="d : ${demandes}">
                    <td class="fw-semibold" th:text="${d.reference}"></td>
                    <td th:text="${d.libelleDocument}"></td>
                    <td th:text="${d.personneConcernee}"></td>
                    <td th:text="${@dates.jour(d.dateCreation)}"></td>
                    <td><span th:replace="~{fragments/statut :: badge(${d.statut}, ${d.libelleStatut})}"></span></td>
                    <td class="text-end">
                        <a th:if="${d.statut == 'A_PAYER'}" class="btn btn-warning btn-sm" th:href="@{/demandes/{id}(id=${d.id})}"><th:block th:text="#{citoyen.demandes.payer}">Payer</th:block></a>
                        <a th:unless="${d.statut == 'A_PAYER'}" class="btn btn-outline-primary btn-sm" th:href="@{/demandes/{id}(id=${d.id})}"><th:block th:text="#{citoyen.demandes.suivre}">Suivre</th:block></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
