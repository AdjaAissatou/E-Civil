spring:
  application:
    name: portail-web
  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: portail-web
            client-secret: ${PORTAIL_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            # Le navigateur va sur l'adresse publique ; le portail parle à Keycloak par le réseau interne
            authorization-uri: ${KEYCLOAK_URL_PUBLIQUE:http://localhost:8180}/realms/ecivil/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_URL_INTERNE:http://localhost:8180}/realms/ecivil/protocol/openid-connect/token
            jwk-set-uri: ${KEYCLOAK_URL_INTERNE:http://localhost:8180}/realms/ecivil/protocol/openid-connect/certs
            user-info-uri: ${KEYCLOAK_URL_INTERNE:http://localhost:8180}/realms/ecivil/protocol/openid-connect/userinfo
            user-name-attribute: sub
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

ecivil:
  url-publique: ${ECIVIL_URL_PUBLIQUE:http://localhost:8080}
  # Les appels aux microservices passent par la passerelle
  api-url: ${ECIVIL_API_URL:http://localhost:8080}
  keycloak:
    url-publique: ${KEYCLOAK_URL_PUBLIQUE:http://localhost:8180}

server:
  port: ${PORT:8090}
  # Derrière la passerelle : reconstruit l'adresse publique à partir des en-têtes X-Forwarded-*
  forward-headers-strategy: framework
  servlet.session.cookie:
    http-only: true
    same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
