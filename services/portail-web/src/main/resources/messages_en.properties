citoyen.nouvelle.le_certificat_est_etabli_d_apres=The certificate is based on your birth record: the civil registry checks that no marriage is recorded in your name in the national register.
citoyen.nouvelle.le_certificat_est_etabli_d_apres_2=The certificate is based on your birth record: the civil registry checks that no ongoing marriage is recorded in your name in the national register.
citoyen.nouvelle.presentez_vous_au_centre_d_etat=Go to the civil registry centre with your ID: the delegate approves the request after seeing you. The civil registry also checks that no death is recorded in your name.
citoyen.nouvelle.le_certificat_est_etabli_d_apres_3=The certificate is based on your birth record and parentage: give your parents as they appear on the record. The registrar checks the file before signing it.
citoyen.nouvelle.indiquez_l_adresse_a_attester_et=Give the address to certify and at least one witness living in the municipality. The delegate approves the request after checking your supporting documents.
citoyen.nouvelle.ce_certificat_est_etabli_par_l=This certificate is drawn up by the registrar when you appear in person, without a Senegalese register record: come to the centre with your passport and witnesses.
citoyen.nouvelle.ce_certificat_est_etabli_par_l_2=This certificate is drawn up by the registrar on your statement: specify the applicable custom and the nationality of your future spouse.
citoyen.nouvelle.le_certificat_atteste_l_evenement_d=The certificate attests the event according to the record in the national register.
citoyen.nouvelle.le_document_reproduit_la_mention_portee=The document reproduces the annotation in the margin of the record: it is only issued if the annotation appears in the national register.
citoyen.nouvelle.l_acte_original_reproduit_l_acte=The original record reproduces the record as it appears in the register, with its marginal annotations.
citoyen.nouvelle.indiquez_les_epoux_tels_qu_ils=Give the spouses as they appear on the marriage record: the couple's children recorded in the national register are added to the booklet automatically.
citoyen.nouvelle.ce_document_concerne_un_acte_dresse=This document concerns a record drawn up following a supplementary judgment: only a record of this origin will be searched for.
citoyen.nouvelle.ce_document_concerne_un_acte_dresse_2=This document concerns a record drawn up abroad and transcribed into the Senegalese registers.
