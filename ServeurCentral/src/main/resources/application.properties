spring.application.name=serveur-central
# Lit aussi le fichier .env (à la racine du dépôt ou du module) s'il existe
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=${PORT:8081}

# Base de données : les identifiants viennent de variables d'environnement.
spring.datasource.url=${REGISTRE_DB_URL:jdbc:postgresql://localhost:5432/registre_central}
spring.datasource.username=${REGISTRE_DB_USER:postgres}
spring.datasource.password=${REGISTRE_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Clé partagée avec le portail E-Civil (en-tête X-API-Key). Obligatoire.
registre.api-key=${REGISTRE_API_KEY:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-stacktrace=never
