# Server Configuration
server.port=8081
#server.servlet.context-path=/ServeurCentral
# Désactiver la sécurité automatique de Tomcat (si nécessaire)
server.servlet.register-default-servlet=false
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/serveur-central-etat-civil
spring.datasource.username=postgres
spring.datasource.password=Dione2003

spring.datasource.driver-class-name=org.postgresql.Driver

# Logging
logging.level.sn.etatcivil=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# API Security - DÉSACTIVÉ
# app.api.key=sk-ecivil-dev-default-key-12345
# \uD83D\uDD25 DÉSACTIVER COMPLÈTEMENT LA SÉCURITÉ SPRING
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration

# \uD83D\uDD25 FORCER LA DÉSACTIVATION DE TOUTE SÉCURITÉ
management.security.enabled=false
security.basic.enabled=false
spring.security.enabled=false
