<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: page('Documents', ~{::main})}">
<body>
<main class="container py-4">
    <h1 class="h3 mb-1">Documents d'état civil</h1>
    <p class="text-muted">Choisissez le document dont vous avez besoin. Le tarif est payé en ligne après validation de la demande.</p>
    <div class="row g-3">
        <div class="col-md-6" th:each="t : ${documents}">
            <div class="card h-100"><div class="card-body d-flex flex-column">
                <div class="d-flex align-items-center gap-3 mb-2">
                    <img class="doc-icone" alt="" th:src="@{${t.typeActe.name() == 'NAISSANCE'} ? '/images/birth.png'
                        : (${t.typeActe.name() == 'DECES'} ? '/images/death.png' : '/images/marriage.png')}">
                    <div>
                        <h2 class="h5 mb-0" th:text="${t.libelle}">Document</h2>
                        <span class="badge text-bg-light" th:text="'Acte de ' + ${#strings.toLowerCase(t.typeActe.libelle)}"></span>
                    </div>
                </div>
                <p class="text-muted small flex-grow-1" th:text="${t.description}"></p>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-semibold text-brun" th:text="${#numbers.formatInteger(t.tarif, 1, 'WHITESPACE')} + ' FCFA'"></span>
                    <a sec:authorize="hasRole('CITOYEN')" class="btn btn-primary btn-sm"
                       th:href="@{/demandes/nouvelle(type=${t.id})}">Faire une demande</a>
                    <a sec:authorize="isAnonymous()" class="btn btn-outline-primary btn-sm" th:href="@{/connexion}">
                        Se connecter pour demander</a>
                </div>
            </div></div>
        </div>
    </div>
</main>
</body>
</html>
