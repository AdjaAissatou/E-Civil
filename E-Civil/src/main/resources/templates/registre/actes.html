<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Registre central', ~{::main})}">
<body>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Registre central des actes</h1>
        <a class="btn btn-primary" th:href="@{/registre/actes/nouveau}"><i class="bi bi-journal-plus me-1"></i>Transcrire un acte</a>
    </div>
    <form class="row g-2 mb-3" method="get">
        <div class="col-md-3">
            <select class="form-select" name="type">
                <option value="">Tous les types</option>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t.libelle}" th:selected="${t == type}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" name="statut">
                <option value="">Tous les statuts</option>
                <option value="SAISI" th:selected="${statut == 'SAISI'}">À valider</option>
                <option value="VALIDE" th:selected="${statut == 'VALIDE'}">Validés</option>
            </select>
        </div>
        <div class="col-md-4"><input class="form-control" name="nom" placeholder="Nom du titulaire" th:value="${nom}"></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Rechercher</button></div>
    </form>
    <div class="card"><div class="table-responsive">
        <table class="table align-middle mb-0">
            <thead><tr><th>N° d'acte</th><th>Type</th><th>Titulaire</th><th>Événement</th><th>Centre</th><th>Statut</th></tr></thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(actes.content)}"><td colspan="6" class="text-center text-muted py-4">Aucun acte.</td></tr>
            <tr th:each="a : ${actes.content}">
                <td class="fw-semibold"><a th:href="@{/registre/actes/{id}(id=${a.id})}" th:text="${a.numeroActe}"></a></td>
                <td th:text="${a.typeActe.libelle}"></td>
                <td th:text="${a.prenom} + ' ' + ${a.nom}"></td>
                <td th:text="${#temporals.format(a.dateEvenement, 'dd/MM/yyyy')}"></td>
                <td th:text="${a.centre}"></td>
                <td><span th:class="${a.estValide()} ? 'badge text-bg-success' : 'badge text-bg-warning'"
                          th:text="${a.estValide()} ? 'Validé' : 'À valider'"></span></td>
            </tr>
            </tbody>
        </table>
    </div></div>
    <nav th:if="${actes.page.totalPages > 1}" class="mt-3">
        <ul class="pagination pagination-sm justify-content-center">
            <li class="page-item" th:classappend="${actes.page.number == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/registre/actes(page=${actes.page.number - 1}, type=${type}, statut=${statut}, nom=${nom})}">Précédent</a></li>
            <li class="page-item disabled"><span class="page-link" th:text="${actes.page.number + 1} + ' / ' + ${actes.page.totalPages}"></span></li>
            <li class="page-item" th:classappend="${actes.page.number + 1 >= actes.page.totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/registre/actes(page=${actes.page.number + 1}, type=${type}, statut=${statut}, nom=${nom})}">Suivant</a></li>
        </ul>
    </nav>
</main>
</body>
</html>
