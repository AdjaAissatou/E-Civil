<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(${titre}, ~{::main})}">
<body>
<main class="container py-4">
    <h1 class="h3 mb-1" th:text="${titre}"></h1>
    <p class="text-muted" th:if="${aide}" th:text="${aide}"></p>

    <form th:if="${filtres}" class="row g-2 mb-3" method="get">
        <div class="col-md-4">
            <select class="form-select" name="statut">
                <option value="">Tous les statuts</option>
                <option th:each="s : ${statuts}" th:value="${s}" th:text="${s.libelle}" th:selected="${s == statut}"></option>
            </select>
        </div>
        <div class="col-md-4"><input class="form-control" name="reference" placeholder="Référence (DEM-…)" th:value="${reference}"></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Filtrer</button></div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Référence</th><th>Document</th><th>Personne concernée</th><th>Demandeur</th><th>Déposée le</th><th>Statut</th><th></th></tr></thead>
                <tbody>
                <tr th:if="${page.empty}"><td colspan="7" class="text-center text-muted py-4">Aucune demande dans cette file.</td></tr>
                <tr th:each="d : ${page.content}">
                    <td class="fw-semibold" th:text="${d.reference}"></td>
                    <td th:text="${d.typeDocument.libelle}"></td>
                    <td th:text="${d.personneConcernee}"></td>
                    <td th:text="${d.demandeur.nomComplet}"></td>
                    <td th:text="${#temporals.format(d.dateCreation, 'dd/MM/yyyy')}"></td>
                    <td><span th:replace="~{fragments/statut :: badge(${d.statut})}"></span></td>
                    <td class="text-end"><a class="btn btn-outline-primary btn-sm" th:href="@{/back-office/demandes/{id}(id=${d.id})}">Ouvrir</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/pagination :: pages(${page})}"></div>
</main>
</body>
</html>
