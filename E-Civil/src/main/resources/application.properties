spring.application.name=e-civil
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# --- Base de données du portail
spring.datasource.url=${ECIVIL_DB_URL:jdbc:postgresql://localhost:5432/ecivil}
spring.datasource.username=${ECIVIL_DB_USER:postgres}
spring.datasource.password=${ECIVIL_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Adresse publique du portail (liens des emails, retour PayDunya, QR code des actes)
ecivil.url-publique=${ECIVIL_URL_PUBLIQUE:http://localhost:8080}

# --- Premier administrateur, créé au démarrage s'il n'existe encore aucun administrateur
ecivil.admin.email=${ECIVIL_ADMIN_EMAIL:}
ecivil.admin.mot-de-passe=${ECIVIL_ADMIN_MOT_DE_PASSE:}

# --- Registre central (ServeurCentral)
ecivil.registre.url=${REGISTRE_URL:http://localhost:8081}
ecivil.registre.api-key=${REGISTRE_API_KEY:}

# --- PayDunya (mode "test" = sandbox, "live" = production)
ecivil.paydunya.mode=${PAYDUNYA_MODE:test}
ecivil.paydunya.master-key=${PAYDUNYA_MASTER_KEY:}
ecivil.paydunya.private-key=${PAYDUNYA_PRIVATE_KEY:}
ecivil.paydunya.token=${PAYDUNYA_TOKEN:}
ecivil.paydunya.nom-boutique=E-Civil S\u00e9n\u00e9gal
ecivil.paydunya.url=${PAYDUNYA_URL:}

# --- Emails (laisser MAIL_HOST vide pour désactiver l'envoi)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
ecivil.mail.expediteur=${MAIL_EXPEDITEUR:${MAIL_USERNAME:}}

management.endpoints.web.exposure.include=health
management.health.mail.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
